<div id="hh-clip">
  <div id="hh-wall" aria-hidden="true"></div>
  <div id="hh-vignette" aria-hidden="true"></div>

  <div id="hh-scene">
    <div id="hh-camera">
      <div id="hh-shadow-plane" class="hh-plane" aria-hidden="true">
        <div id="hh-paper-shadow"></div>
      </div>

      <div id="hh-flight" class="hh-plane">
        <article id="hh-paper">
          <header id="hh-source-header">
            <div class="hh-masthead-row">
              <span id="hh-masthead"></span>
            </div>
            <div id="hh-strapline-row">
              <span id="hh-strapline"></span>
            </div>
            <div id="hh-edition-row" class="hh-meta-row">
              <span id="hh-edition"></span>
              <span id="hh-article-date"></span>
            </div>
            <div id="hh-navigation-row">
              <span id="hh-navigation"></span>
            </div>
            <div id="hh-section-row">
              <span id="hh-section"></span>
            </div>
            <h1 id="hh-headline"></h1>
            <div id="hh-byline-row" class="hh-meta-row">
              <span id="hh-byline"></span>
              <span id="hh-reading-time"></span>
            </div>
          </header>

          <div id="hh-body-wrap">
            <p id="hh-body"></p>
            <div id="hh-marks" aria-hidden="true"></div>
            <div id="hh-margin-mark" aria-hidden="true">
              <i id="hh-margin-diamond"></i>
              <div class="hh-rail-track">
                <i id="hh-rail-glint"></i>
              </div>
            </div>
          </div>

          <footer id="hh-footer-row">
            <span id="hh-footer"></span>
          </footer>

          <div id="hh-proof-line" aria-hidden="true">
            <i id="hh-proof-glint"></i>
          </div>
        </article>
      </div>
    </div>
  </div>

  <div id="hh-post-rig">
    <div id="hh-post-shadow" aria-hidden="true"></div>
    <aside id="hh-post-card">
      <div id="hh-post-header">
        <div id="hh-avatar"></div>
        <div id="hh-post-identity">
          <div id="hh-name-row">
            <span id="hh-post-name"></span>
            <svg id="hh-verified" viewBox="0 0 32 32" aria-hidden="true">
              <path
                d="M16 1.5l4 2.5 4.7.2 1.6 4.4 3.6 3-.9 4.6.9 4.6-3.6 3-1.6 4.4-4.7.2-4 2.5-4-2.5-4.7-.2-1.6-4.4-3.6-3 .9-4.6-.9-4.6 3.6-3 1.6-4.4 4.7-.2z"
                fill="currentColor"
              />
              <path
                d="M9.7 16.1l4.2 4.1 8.4-8.5"
                fill="none"
                stroke-width="3"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </div>
          <div id="hh-post-meta">
            <span id="hh-post-handle"></span>
            <span id="hh-post-date"></span>
          </div>
        </div>
      </div>
      <div id="hh-post-text"></div>
    </aside>
  </div>
</div>
