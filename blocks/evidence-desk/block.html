<div id="ed-clip">
  <div id="ed-camera">
    <div id="ed-impact">
      <div id="ed-mat"></div>
      <div id="ed-mat-marks"></div>

      <div id="ed-quote-shadow" class="ed-shadow"></div>
      <section id="ed-quote" class="ed-paper ed-plane"
        data-hf-motion-blur='{"shutterAngle":110,"shutterPhase":-55,"samplesPerFrame":12,"sharp":0}'>
        <div class="ed-paper-grain"></div>
        <div id="ed-quote-header" class="ed-quote-header">
          <span id="ed-interview"></span>
          <span id="ed-date"></span>
        </div>
        <div id="ed-quote-rule"></div>
        <div id="ed-quote-lines"></div>
        <div id="ed-attribution"></div>
        <div id="ed-quote-footer"></div>
      </section>

      <div id="ed-chart-shadow" class="ed-shadow"></div>
      <section id="ed-chart" class="ed-paper ed-plane"
        data-hf-motion-blur='{"shutterAngle":110,"shutterPhase":-55,"samplesPerFrame":12,"sharp":0}'>
        <div class="ed-paper-grain"></div>
        <span id="ed-chart-title"></span>
        <div id="ed-chart-subtitle" class="ed-chart-context"></div>
        <span id="ed-metric" class="ed-chart-context"></span>
        <div id="ed-plot-grid" class="ed-chart-context"></div>
        <div id="ed-rows"></div>
        <div id="ed-axis" class="ed-chart-context"></div>
        <div id="ed-source" class="ed-chart-context"></div>
        <span id="ed-note"></span>
        <div id="ed-arrow"></div>
      </section>

      <div id="ed-label-shadow" class="ed-shadow"></div>
      <div id="ed-label" class="ed-plane"
        data-hf-motion-blur='{"shutterAngle":100,"shutterPhase":-50,"samplesPerFrame":12,"sharp":0}'>
        <div id="ed-label-face">
          <div class="ed-paper-grain"></div>
          <span id="ed-label-text"></span>
        </div>
        <div id="ed-tape-a" class="ed-tape"></div>
        <div id="ed-tape-b" class="ed-tape"></div>
      </div>
    </div>
  </div>

  <div id="ed-light"></div>
  <div id="ed-vignette"></div>
  <div id="ed-film"></div>
</div>
