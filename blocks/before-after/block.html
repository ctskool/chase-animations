<div id="ba-clip">

                <span id="ba-old-heading-2"></span>
              </h2>
              <div class="ba-button-row">
                <span id="ba-old-button" class="ba-button"></span>
              </div>

            <path d="m27 12-12 12 12 12m26-24 12 12-12 12" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
