<div id="fg-clip">
  <div id="fg-photo" aria-hidden="true"></div>

  <section id="fg-panel" class="fg-glass">
    <div id="fg-highlight" aria-hidden="true">
      <div id="fg-highlight-sheen"></div>
      <div id="fg-selection-mark"></div>
    </div>

    <div id="fg-rows"></div>

    <svg id="fg-edge" aria-hidden="true" preserveAspectRatio="none">
      <rect id="fg-edge-line" fill="none" pathLength="1000"
        stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-dasharray="90 910"></rect>
    </svg>
  </section>

  <div id="fg-bar" class="fg-glass">
    <svg id="fg-search-icon" viewBox="0 0 48 48" fill="none"
      stroke="currentColor" stroke-width="2.8"
      stroke-linecap="round" aria-hidden="true">
      <circle cx="20" cy="20" r="12"></circle>
      <path d="M29 29L40 40"></path>
    </svg>

    <div id="fg-query-line">
      <span id="fg-query-copy"></span><span id="fg-caret" aria-hidden="true"></span>
    </div>

    <div id="fg-bar-sheen" aria-hidden="true"></div>
  </div>
</div>
