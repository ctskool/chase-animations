<div id="clip">
  <div id="backdrop"></div>
  <div id="grain"></div>
  <div id="shadow"></div>

  <div id="cam" data-hf-motion-blur='{"shutterAngle": 110, "shutterPhase": -55, "samplesPerFrame": 14, "sharp": 0}'>
    <div id="window">
      <div class="titlebar" data-context>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="app-name" id="app-name"></span>
      </div>

      <div class="body" id="screen">
        <nav class="sidebar" id="sidebar" data-context></nav>

        <main class="main">
          <header class="head" id="head" data-context>
            <div class="head-text">
              <div class="project" id="project"></div>
              <div class="subtitle" id="subtitle"></div>
            </div>
          </header>

          <div class="content">
            <div class="workspace" id="workspace" data-context>
              <div class="preview">
                <div class="preview-frame"></div>
                <div class="play"></div>
              </div>

              <div class="stats">
                <div class="stat">
                  <span class="stat-label" id="s1l"></span>
                  <span class="stat-value" id="s1v"></span>
                </div>
                <div class="stat">
                  <span class="stat-label" id="s2l"></span>
                  <span class="stat-value" id="s2v"></span>
                </div>
              </div>

              <div class="timeline">
                <span class="timecode" id="timecode"></span>
                <div class="track">
                  <i style="width:34%"></i>
                  <i style="width:22%"></i>
                  <i style="width:30%"></i>
                </div>
                <div class="track alt">
                  <i style="width:18%"></i>
                  <i style="width:46%"></i>
                </div>
                <div class="scrub" id="scrub"></div>
              </div>
            </div>

            <section class="publish-panel" id="publish-panel" data-focus>
              <div id="panel-wash"></div>

              <button class="primary" id="target" data-target type="button">
                <span class="btn-label" id="btn-label"></span>
                <span class="btn-label btn-pending" id="btn-pending"></span>
                <span class="btn-label btn-done" id="btn-done"></span>
              </button>

              <div class="targets" id="targets"></div>

              <svg id="panel-outline" aria-hidden="true" preserveAspectRatio="none">
                <rect id="energy-line" pathLength="1000" fill="none"
                  stroke="currentColor" stroke-width="3"
                  stroke-linecap="round" stroke-dasharray="72 928"></rect>
              </svg>
            </section>
          </div>
        </main>
      </div>
    </div>
  </div>

  <div id="click-ring"></div>
  <div id="ring"></div>
  <div id="ripple"></div>

  <div id="cursor" data-hf-motion-blur='{"shutterAngle": 150, "shutterPhase": -75, "samplesPerFrame": 14}'>
    <svg viewBox="0 0 28 34" width="46" height="56" fill="none" aria-hidden="true">
      <path class="cursor-shape"
        d="M4 2.5v24.2l6.3-6.1 4 9.9 5.1-2.1-4.1-9.7 8.8-.4L4 2.5z"
        stroke-width="2.2" stroke-linejoin="round"></path>
    </svg>
  </div>

  <div id="step">
    <span id="step-num"></span>
    <span id="step-text"></span>
  </div>
</div>
