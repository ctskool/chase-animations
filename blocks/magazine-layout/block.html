<div id="ml-page">
  <div id="ml-paper-grain" aria-hidden="true"></div>
  <svg id="ml-fibres" aria-hidden="true"></svg>

  <svg id="ml-rule" aria-hidden="true">
    <path id="ml-rule-stroke"></path>
  </svg>

  <header id="ml-headline">
    <div id="ml-headline-mask-1" class="ml-headline-mask">
      <span id="ml-headline-1" class="ml-headline-line"></span>
    </div>
    <div id="ml-headline-mask-2" class="ml-headline-mask">
      <span id="ml-headline-2" class="ml-headline-line ml-italic"></span>
    </div>
  </header>

  <div id="ml-photo" role="img">
    <div id="ml-image">
      <svg id="ml-sea" aria-hidden="true"></svg>
    </div>
    <div id="ml-film-grain" aria-hidden="true"></div>
  </div>

  <div id="ml-body"></div>

  <div id="ml-caption-mask">
    <span id="ml-caption"></span>
  </div>

  <svg id="ml-annotations">
    <g id="ml-note"></g>
  </svg>

  <div id="ml-tooth" aria-hidden="true"></div>
</div>
