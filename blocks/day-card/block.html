<div id="clip">
  <div id="background"></div>
  <div id="grain" aria-hidden="true"></div>

  <div id="label-row">
    <i class="hairline" aria-hidden="true"></i>
    <span id="challenge-label"></span>
    <i class="hairline" aria-hidden="true"></i>
  </div>

  <div id="counter">
    <svg id="counter-marker" aria-hidden="true"></svg>
    <div id="counter-type">
      <span id="day-word"></span>
      <span id="day-number"></span>
    </div>
  </div>

  <div id="calendar">
    <div id="calendar-paper" aria-hidden="true"></div>
    <div id="peg-left" class="peg" aria-hidden="true"></div>
    <div id="peg-right" class="peg" aria-hidden="true"></div>
    <span id="month"></span>
    <div id="weekdays"></div>
    <div id="grid">
      <div id="date-focus" aria-hidden="true"></div>
    </div>
  </div>
</div>
